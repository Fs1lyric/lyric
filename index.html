/* layout: one 50rem column; home is a single centered card over a living ascii field, every other page gets a slim header */
:root {
  --bg: #111315; --bg-2: #181b1f; --bg-3: #24272e;
  --txt-3: #4c5361; --txt-2: #7a8599; --txt: #bcc5d8; --txt-0: #dde4f2;
  --cyan: #2cc4d6; --violet: #6d6af0; --magenta: #c26ae8;
  --field: 220, 14%; --field-l: 52%;
  --c0: #161b22; --c1: #0d2b52; --c2: #144a8a; --c3: #1f6feb; --c4: #58a6ff;
  --mono: "Space Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --sans: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f3f4f7; --bg-2: #e8eaef; --bg-3: #d6d9e1;
  --txt-3: #a3a9b6; --txt-2: #5f687a; --txt: #313846; --txt-0: #12161d;
  --cyan: #0e8597; --violet: #4b47d6; --magenta: #9a3fc4; --field-l: 46%;
  --c0: #ebedf0; --c1: #b6e3ff; --c2: #54aeff; --c3: #0969da; --c4: #0a3069;
  color-scheme: light;
} }
:root[data-theme="light"] {
  --bg: #f3f4f7; --bg-2: #e8eaef; --bg-3: #d6d9e1;
  --txt-3: #a3a9b6; --txt-2: #5f687a; --txt: #313846; --txt-0: #12161d;
  --cyan: #0e8597; --violet: #4b47d6; --magenta: #9a3fc4; --field-l: 46%;
  --c0: #ebedf0; --c1: #b6e3ff; --c2: #54aeff; --c3: #0969da; --c4: #0a3069;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { height: 100%; scrollbar-width: thin; scrollbar-color: var(--bg-3) transparent; }
body {
  margin: 0; min-height: 100%; display: flex; flex-direction: column;
  background: var(--bg); color: var(--txt);
  font-family: var(--sans); font-weight: 300; font-size: 16px;
  padding-inline: 1.5rem; overflow-x: hidden;
}
::selection { background: var(--cyan); color: var(--bg); }
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 4px; border-radius: 2px; }
h1, h2, h3 { font-family: var(--mono); font-weight: 400; color: var(--txt-0); letter-spacing: -0.02em; line-height: 1.35; text-wrap: balance; }
p { font-size: 1.125rem; line-height: 1.75; margin: 1rem 0; max-width: 62ch; }
code { font-family: var(--mono); font-size: .92em; background: var(--bg-2); padding: 0 .3em; }

canvas#field { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

/* nav link: the slash folds into an arrow */
a.nav { position: relative; font-family: var(--mono); white-space: nowrap; }
a.nav .arrow { position: absolute; top: -.02em; transform-origin: 50% 53%; transform: rotate(-72deg) scaleY(0); transition: transform .3s; }
a.nav .slash { display: inline-block; line-height: 0; transition: transform .3s, margin .3s; }
a.nav:hover .arrow, a.nav:focus-visible .arrow, a.nav[aria-current="page"] .arrow { transform: none; }
a.nav:hover .slash, a.nav:focus-visible .slash, a.nav[aria-current="page"] .slash { margin-right: 1.1ch; transform: scale(.5) rotate(72deg); }
a.nav[aria-current="page"] { color: var(--txt-0); }

a.ext { text-decoration: underline transparent 2px; text-underline-offset: 3px; transition: text-decoration-color .2s; }
a.ext .arrow { display: inline-block; margin-left: .5ch; transition: transform .2s; }
a.ext:hover { text-decoration-color: currentColor; }
a.ext:hover .arrow { transform: translate(.2em, -.2em); }

a.back { font-family: var(--mono); color: var(--txt-2); font-size: 1rem; }
a.back .arrow { display: inline-block; margin-right: .5ch; transition: transform .2s; }
a.back:hover { color: var(--txt-0); }
a.back:hover .arrow { transform: translateX(-.3em); }

header {
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem 2rem;
  max-width: 50rem; width: 100%; margin: 0 auto; padding-block: 2rem 0; transition: opacity .3s;
}
header .brand { display: flex; align-items: center; gap: .9rem; font-family: var(--mono); font-size: 1.25rem; color: var(--txt-0); }
header nav { display: flex; flex-wrap: wrap; gap: .75rem 1.5rem; font-size: 1.02rem; }
body.home header { opacity: 0; pointer-events: none; }

main { flex: 1; width: 100%; max-width: 50rem; margin: 0 auto; padding-block: 3rem 4rem; }
.view { animation: rise .45s cubic-bezier(.2,.7,.3,1) both; }
@keyframes rise { from { opacity: .001; transform: translateY(8px); } }

/* home */
body.home main { display: flex; align-items: center; justify-content: center; max-width: none; padding-block: 2rem 8rem; }
.hero { max-width: 44rem; }
.hero .row { display: flex; align-items: center; gap: 1.5rem; }
.hero h1 { margin: 0; font-size: 3rem; }
.hero p { font-size: 1.25rem; margin: 1rem 0 1.75rem; }
.hero nav { display: flex; gap: 1rem 2rem; flex-wrap: wrap; font-size: 1.5rem; }
.hero .now { margin-top: 2.25rem; display: flex; gap: .75ch; font-family: var(--mono); font-size: .85rem; color: var(--txt-2); }
.hero .now .dot { width: .5rem; height: .5rem; border-radius: 50%; background: var(--cyan); align-self: center; animation: blink 2.4s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .25; } }


/* pages */
.page h1 { font-size: 2.5rem; margin: 1rem 0 1.5rem; }
.page h2 { font-size: 1.4rem; margin: 3rem 0 1rem; }
.lede { color: var(--txt-2); font-size: 1.125rem; margin-top: -.5rem; }


.hobbies { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 1.25rem; }
.hobbies .emoji { display: block; font-size: 2.5rem; line-height: 1; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; transition: transform .3s cubic-bezier(.2,.7,.3,1.4); cursor: default; }
.hobbies a.emoji { cursor: pointer; }
.hobbies .emoji:hover, .hobbies .emoji:focus-visible { transform: scale(1.2) rotate(-8deg); }

/* projects */
.projects { list-style: none; padding: 0; margin: 2.5rem 0 0; display: grid; gap: 3rem; }
.project a.card { display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr); gap: 1.75rem; align-items: start; }
.cover { aspect-ratio: 4 / 3; max-width: 100%; background: var(--bg-2); border: 1px solid var(--bg-3); overflow: hidden; position: relative; transition: border-color .25s; }
.cover canvas, .cover img { width: 100%; height: 100%; display: block; object-fit: cover; transition: transform .5s cubic-bezier(.2,.7,.3,1); }
.project a.card:hover .cover { border-color: var(--txt-3); }
.project a.card:hover .cover canvas, .project a.card:hover .cover img { transform: scale(1.04); }
.project .meta { display: flex; gap: 1rem; font-family: var(--mono); font-size: .82rem; color: var(--txt-3); font-variant-numeric: tabular-nums; }
.project h3 { margin: .35rem 0 0; font-size: 1.35rem; display: flex; align-items: baseline; gap: .75ch; }
.project h3 .arrow { opacity: 0; transform: translateX(-.5em); transition: all .2s; color: var(--cyan); }
.project a.card:hover h3 .arrow, .project a.card:focus-visible h3 .arrow { opacity: 1; transform: none; }
.project p { margin: .5rem 0 .75rem; font-size: 1rem; line-height: 1.65; color: var(--txt-2); }
.tags { display: flex; flex-wrap: wrap; gap: .5rem .9rem; font-family: var(--mono); font-size: .78rem; color: var(--txt-2); }
.tags span::before { content: "#"; color: var(--txt-3); }

/* about: tech + links */
.tech { display: grid; gap: .9rem; margin: 0; }
.tech div { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 1rem; align-items: baseline; }
.tech dt { font-family: var(--mono); font-size: .82rem; color: var(--txt-3); }
.tech dd { margin: 0; display: flex; flex-wrap: wrap; gap: .5rem; }
.tech dd span { font-family: var(--mono); font-size: .85rem; padding: .2rem .6rem; border: 1px solid var(--bg-3); color: var(--txt); transition: border-color .2s, color .2s; }
.tech dd span:hover { border-color: var(--c3); color: var(--txt-0); }
.links { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: .75rem 2rem; font-family: var(--mono); font-size: 1.05rem; }
@media (max-width: 720px) { .tech div { grid-template-columns: 1fr; gap: .4rem; } }

/* photos + inspo */
.gallery { columns: 3 14rem; column-gap: 1rem; margin-top: 2rem; }
.gallery button { display: block; width: 100%; margin: 0 0 1rem; padding: 0; border: 0; background: var(--bg-2); cursor: zoom-in; break-inside: avoid; overflow: hidden; }
.gallery img { display: block; width: 100%; height: auto; transition: transform .5s cubic-bezier(.2,.7,.3,1), opacity .3s; opacity: .9; }
.gallery button:hover img { transform: scale(1.03); opacity: 1; }
.inspo { list-style: none; padding: 0; margin: 0; columns: 2 22rem; column-gap: 1.5rem; }
body.wide header, body.wide main, body.wide footer { max-width: 72rem; }
.inspo li { break-inside: avoid; margin-bottom: 1.25rem; }
.inspo a { display: grid; gap: .45rem; }
.inspo .thumb { display: block; background: var(--bg-2); border: 1px solid var(--bg-3); overflow: hidden; transition: border-color .25s; }
.inspo .thumb img { display: block; width: 100%; height: auto; transition: transform .5s cubic-bezier(.2,.7,.3,1); }
.inspo a:hover .thumb { border-color: var(--c3); }
.inspo a:hover .thumb img { transform: scale(1.03); }
.inspo .t { font-family: var(--mono); font-size: .75rem; color: var(--txt-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color .2s; }
.inspo a:hover .t { color: var(--txt); }
.empty { font-family: var(--mono); font-size: .9rem; color: var(--txt-3); margin-top: 2rem; }
.lightbox { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 1.5rem; background: color-mix(in srgb, var(--bg) 92%, transparent); cursor: zoom-out; animation: rise .25s ease both; }
.lightbox img { max-width: 100%; max-height: 90vh; object-fit: contain; }

/* blog */
.posts { list-style: none; padding: 0; margin: 2rem 0 0; display: grid; }
.posts a { display: grid; grid-template-columns: 7rem minmax(0, 1fr); gap: .25rem 1.5rem; padding: 1.1rem 1.25rem; margin-inline: -1.25rem; transition: background .2s; }
.posts a:hover, .posts a:focus-visible { background: color-mix(in srgb, var(--bg-2) 85%, transparent); }
.posts time { font-family: var(--mono); font-size: .85rem; color: var(--txt-3); padding-top: .2rem; font-variant-numeric: tabular-nums; }
.posts h3 { margin: 0; font-size: 1.15rem; }
.posts p { margin: .2rem 0 0; font-size: 1rem; line-height: 1.6; color: var(--txt-2); }
.draft { font-family: var(--mono); font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; color: var(--magenta); border: 1px solid currentColor; padding: .05rem .35rem; margin-left: .6rem; vertical-align: .2em; }
.post .when { font-family: var(--mono); font-size: .85rem; color: var(--txt-3); }
.post h1 { margin-top: 2rem; }
.post .body p { font-size: 1.1rem; }
.post .body h2 { font-size: 1.25rem; }
.post .body blockquote { margin: 2rem 0; padding-left: 1.5rem; border-left: 2px solid var(--txt-3); color: var(--txt-2); }

/* contributions */
.contrib-total { font-family: var(--mono); font-size: .9rem; color: var(--txt-2); margin: 0 0 1rem; }
.contrib-total b { font-weight: 400; color: var(--txt-0); }
.heat-wrap { overflow-x: auto; padding-bottom: .25rem; scrollbar-width: thin; }
.heat { display: grid; grid-template-rows: auto repeat(7, auto); grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 3px; min-width: 38rem; }
.heat .m { grid-row: 1; font-family: var(--mono); font-size: .7rem; color: var(--txt-3); white-space: nowrap; overflow: visible; padding-bottom: .2rem; }
.heat i, .legend i { display: block; aspect-ratio: 1; border-radius: 2px; background: var(--c0); }
.heat i[data-l="1"], .legend i[data-l="1"] { background: var(--c1); }
.heat i[data-l="2"], .legend i[data-l="2"] { background: var(--c2); }
.heat i[data-l="3"], .legend i[data-l="3"] { background: var(--c3); }
.heat i[data-l="4"], .legend i[data-l="4"] { background: var(--c4); }
.legend { display: flex; align-items: center; gap: .5rem; justify-content: flex-end; font-family: var(--mono); font-size: .72rem; color: var(--txt-3); margin-top: .6rem; }
.legend .heat-key { display: flex; gap: 3px; }
.legend i { width: .7rem; }
.fine { font-size: .9rem; color: var(--txt-3); max-width: 62ch; line-height: 1.6; }


footer a { color: var(--txt-2); transition: color .2s; }
footer a:hover { color: var(--txt-0); }

/* contact */
.contact { list-style: none; padding: 0; margin: 2rem 0; display: grid; gap: 1.25rem; font-size: 1.25rem; }
.contact .k { font-family: var(--mono); font-size: .82rem; color: var(--txt-3); display: block; margin-bottom: .1rem; }
.copy { font: inherit; font-family: var(--mono); font-size: .8rem; background: var(--bg-2); color: var(--txt-2); border: 1px solid var(--bg-3); padding: .2rem .6rem; margin-left: .75rem; cursor: pointer; vertical-align: middle; }
.copy:hover { color: var(--txt-0); border-color: var(--txt-3); }

footer { max-width: 50rem; width: 100%; margin: 0 auto; padding-block: 1.5rem 2rem; font-family: var(--mono); font-size: .8rem; color: var(--txt-3); display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
body.home footer { display: none; }

@media (max-width: 720px) {
  body { font-size: 15px; padding-inline: 1rem; }
  .hero .row { flex-direction: column-reverse; align-items: flex-start; gap: .75rem; }
  .hero h1 { font-size: 2.6rem; }
  .hero nav { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; font-size: 1.3rem; }
  .page h1 { font-size: 2rem; }
  .project a.card { grid-template-columns: 1fr; gap: 1rem; }
  .posts a { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0s !important; animation-delay: 0s !important; transition-duration: 0s !important; }
}
</style>

    { slug: "one-filter-graph", date: "2026-10-04", draft: true,
      title: "the whole timeline is one ffmpeg command",
      summary: "how odyssey's video editor exports without rendering a single intermediate file.",
      body: `<p>most hobby video editors render each clip, then stitch the results. that means temp files, quality loss on every pass and an export that takes as long as the slowest step twice over.</p>
<p>odyssey design does it differently. when you hit export, the whole project, every track, cut, crossfade and title, compiles into one ffmpeg <code>filter_complex</code> graph. ffmpeg decodes each source once and writes the final file once.</p>
<h2>what that buys</h2>
<p>no intermediate renders, no disk churn, and the export is exactly as good as the sources allow. the cost is that the graph builder has to be right, because there is no step in between where you can look at a half-finished file.</p>
<blockquote>the timeline is the program. ffmpeg is the runtime.</blockquote>` },

<p>odyssey stores everything as rows in one <code>items</code> table with a <code>kind</code> column, plus a <code>links</code> table for relationships. a "notes app" is just a view filtered to <code>kind = note</code>. linking a task to a contact is one row, not an integration.</p>
<p>it's a bet. one schema has to carry very different shapes of data. but the alternative is the thing i was trying to get away from.</p>` },

function contribSection() {
  const C = SITE.contrib, total = Object.values(C.days).reduce((a, b) => a + b, 0);
  return `
      <h2>contributions</h2>
      <div class="heat-wrap" id="heat-wrap"><div class="heat" role="img" aria-label="${total} public commits between ${fmtDate(C.from)} and ${fmtDate(C.asOf)}">${heatCells(C)}</div></div>`;
}

function heatCells(C) {
  const lv = n => !n ? 0 : n < 3 ? 1 : n < 10 ? 2 : n < 30 ? 3 : 4;
  const start = new Date(C.from + "T00:00:00Z"), end = new Date(C.asOf + "T00:00:00Z");
  start.setUTCDate(start.getUTCDate() - start.getUTCDay());
  let out = "", col = 0, lastMonth = -1;
  for (const d = new Date(start); d <= end; col++) {
    const m = d.getUTCMonth();
    out += `<span class="m" style="grid-column:${col + 1}">${m !== lastMonth && d.getUTCDate() <= 7 ? d.toLocaleDateString("en-GB", { month: "short", timeZone: "UTC" }).toLowerCase() : ""}</span>`;
    if (m !== lastMonth && d.getUTCDate() <= 7) lastMonth = m;
    for (let wd = 0; wd < 7; wd++, d.setUTCDate(d.getUTCDate() + 1)) {
      const key = d.toISOString().slice(0, 10), n = C.days[key] || 0, l = lv(n);
      const label = d > end ? "" : `${n} commit${n === 1 ? "" : "s"} on ${fmtDate(key)}`;
      out += d > end ? `<i style="grid-column:${col + 1};grid-row:${wd + 2};visibility:hidden"></i>`
        : `<i style="grid-column:${col + 1};grid-row:${wd + 2}" data-l="${l}" title="${label}"></i>`;
    }
  }
  return out;
}

const hash2 = (x, y) => { const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); };
const clamp = v => v < 0 ? 0 : v > 1 ? 1 : v;

/* ascii project covers, drawn in the same character set as the background */
function drawCover(cv) {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const w = cv.width = Math.round(cv.clientWidth * dpr), h = cv.height = Math.round(cv.clientHeight * dpr);
  const ctx = cv.getContext("2d"), cs = getComputedStyle(document.documentElement);
  const col = { c: cs.getPropertyValue("--cyan").trim(), v: cs.getPropertyValue("--violet").trim(), m: cs.getPropertyValue("--magenta").trim(), d: cs.getPropertyValue("--txt-3").trim() };
  const cw = 9 * dpr, ch = 13 * dpr;
  ctx.font = `${10 * dpr}px "Space Mono", monospace`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const cols = Math.floor(w / cw), rows = Math.floor(h / ch);
  for (let gy = 1; gy < rows; gy++) for (let gx = 1; gx < cols; gx++) {
    const u = gx / cols, v = gy / rows, r = hash2(gx, gy);
    let chr = null, color = col.d, a = .35;
    if (cv.dataset.cover === "timeline") {
      /* stacked tracks of clips with a playhead */
      const track = Math.floor(v * 6);
      const lane = (v * 6) % 1;
      if (track >= 1 && track <= 4 && lane > .2 && lane < .8) {
        const seed = Math.sin(track * 9.1) * .5 + .5;
        const clip = Math.sin(u * (8 + track * 3) + seed * 6) > -.2;
        if (clip) { chr = track === 4 ? "~" : "="; color = [col.c, col.v, col.m, col.c][track - 1]; a = .55 + r * .3; }
      }
      if (Math.abs(u - .62) < .012) { chr = "|"; color = col.m; a = .95; }
    } else if (cv.dataset.cover === "neuron") {
      /* a neuron: soma, branching dendrites, an axon running off to the right */
      const x = (u - .5) * 2 * (w / h) - .35, y = (v - .5) * 2;
      const seg = (ax, ay, bx, by) => { const dx = bx - ax, dy = by - ay, t = clamp(((x - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy)); return Math.hypot(x - ax - t * dx, y - ay - t * dy); };
      const tree = [[-.3, 0, -.9, -.55], [-.9, -.55, -1.3, -.85], [-.9, -.55, -1.35, -.35], [-.3, 0, -1.0, .35], [-1.0, .35, -1.4, .2], [-1.0, .35, -1.25, .8],
        [-.3, 0, -.55, -.85], [-.55, -.85, -.9, -.95], [-.3, 0, -.6, .8], [-.6, .8, -.35, .95]];
      const dend = Math.min(...tree.map(t => seg(...t)));
      const axon = Math.abs(y - .12 * Math.sin(x * 3)) + (x < -.2 ? 9 : 0);
      const d = Math.hypot(x + .3, y);
      if (d < .26) { chr = d < .13 ? "@" : "#"; color = col.m; a = .95; }
      else if (dend < .085) { chr = r > .5 ? "+" : "*"; color = col.v; a = .85; }
      else if (axon < .07) { chr = Math.sin(x * 14 - 1) > .6 ? "o" : "-"; color = col.c; a = .85; }
    } else {
      /* an eye drawn in ink: almond outline, iris rings, a pupil, a drip */
      const x = (u - .5) * 2 * (w / h), y = (v - .5) * 2;
      const lid = Math.abs(y) - .62 * (1 - (x / 1.25) ** 2);
      const d = Math.hypot(x, y);
      if (Math.abs(lid) < .07 && Math.abs(x) < 1.25) { chr = r > .5 ? "+" : ":"; color = col.c; a = .85; }
      else if (lid < 0 && d < .42) { chr = d < .16 ? "#" : Math.abs(Math.sin(d * 40)) > .55 ? ":" : "."; color = d < .16 ? col.m : col.v; a = d < .16 ? .95 : .7; }
      else if (Math.abs(x - .05) < .03 && y > .2 && y < .9 - r * .3) { chr = ":"; color = col.m; a = .7; }
    }
    if (!chr) { if (r > .82) chr = "."; else continue; }
    ctx.globalAlpha = a; ctx.fillStyle = color; ctx.fillText(chr, gx * cw, gy * ch);
  }
  ctx.globalAlpha = 1;
}

addEventListener("hashchange", route);
route();

/* background field: layered sine contours, warped by value noise, pulled by the cursor; a click sends out a ring */
(() => {
  const cv = document.getElementById("field");
  const ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  const CW = 14, CH = 18, FS = 12;
  let dpr = 1, raf = 0, last = 0, ring = null;
  const ptr = { x: .5, y: .5 }, target = { x: .5, y: .5 };
  const fade = t => t * t * (3 - 2 * t);
  const noise = (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), u = fade(x - xi), v = fade(y - yi);
    const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
    return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
  };
  function size() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = Math.round(cv.clientWidth * dpr);
    cv.height = Math.round(cv.clientHeight * dpr);
  }
  function draw(now) {
    const w = cv.width, h = cv.height;
    if (!w || !h) return;
    const cs = getComputedStyle(document.documentElement);
    const hs = cs.getPropertyValue("--field").trim(), L = parseFloat(cs.getPropertyValue("--field-l"));
    const t = reduce.matches ? 0 : now * 1e-4, ar = w / h;
    const cw = CW * dpr, ch = CH * dpr;
    ptr.x += (target.x - ptr.x) * .1; ptr.y += (target.y - ptr.y) * .1;
    const rp = ring ? (now - ring.t0) / 2800 : 2;
    if (rp > 1) ring = null;
    /* sub-pages dim the field so text stays readable */
    const dim = document.body.classList.contains("home") ? 1 : .45;
    ctx.clearRect(0, 0, w, h);
    ctx.font = `${FS * dpr}px "Space Mono", monospace`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (let y = ch; y < h; y += ch) for (let x = cw; x < w; x += cw) {
      const u = x / w, v = y / h, gx = Math.round(x / cw), gy = Math.round(y / ch);
      const dx = (u - ptr.x) * ar, dy = v - ptr.y;
      const pull = clamp(1 - Math.hypot(dx, dy) / .32) ** 2 * .7;
      const warp = (noise(u * 4 * ar + t * .12, v * 4 - t * .08) - .5) * .8;
      const f = Math.sin(u * 10 + v * 3 + t) + .6 * Math.sin(v * 14 - t * .7) + .3 * Math.sin((u - v) * 22 + t * .4) + warp + pull;
      const band = Math.abs(Math.sin(f * 2.6));
      const r = hash2(gx, gy);
      const vis = clamp((band - (.88 + r * .1) + .025) / .05);
      let pulse = 0;
      if (ring) {
        const d = Math.hypot((u - ring.x) * ar, v - ring.y) - rp * Math.hypot(ar, 1) + f * .01;
        pulse = Math.exp(-((d / (.12 + rp * .03)) ** 2) * 1.8) * clamp((1 - rp) / .25) * (.2 + clamp((band - .6) / .25) * .8);
      }
      if (vis < .01 && pulse < .01) continue;
      const edge = Math.min(1, u / .04, (1 - u) / .04) * Math.min(1, v / .05, (1 - v) / .05);
      const a = ((.33 + Math.max(0, band - .9)) * vis * dim + pulse * .8) * edge;
      ctx.fillStyle = `hsla(${hs}, ${L + clamp(pulse * 1.8) * 25}%, ${a})`;
      ctx.fillText(r > .9 ? "+" : r > .62 ? ":" : ".", x, y);
    }
  }
  function loop(now) {
    if (now - last > (ring ? 12 : 48)) { draw(now); last = now; }
    raf = requestAnimationFrame(loop);
  }
  function start() { cancelAnimationFrame(raf); size(); draw(performance.now()); if (!reduce.matches) raf = requestAnimationFrame(loop); }
  addEventListener("pointermove", e => { target.x = e.clientX / innerWidth; target.y = e.clientY / innerHeight; }, { passive: true });
  addEventListener("pointerdown", e => { if (!reduce.matches && !e.target.closest("a,button")) ring = { x: e.clientX / innerWidth, y: e.clientY / innerHeight, t0: performance.now() }; });
  addEventListener("resize", () => { size(); draw(performance.now()); app.querySelectorAll("canvas[data-cover]").forEach(drawCover); }, { passive: true });
  addEventListener("hashchange", () => draw(performance.now()));
  reduce.addEventListener?.("change", start);
  document.fonts?.ready.then(() => { draw(performance.now()); app.querySelectorAll("canvas[data-cover]").forEach(drawCover); });
  start();
})();
</script>
</body>
